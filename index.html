<style>
:root{--bg:#000;--c1:#161618;--c2:#262629;--c3:#323236;--ln:rgba(255,255,255,0.09);--ln2:rgba(255,255,255,0.16);--tx:#f5f5f7;--mu:#98989f;--mu2:#5e5e63;--ease:cubic-bezier(.22,.9,.28,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);

.cd{display:flex;gap:6px}.cd>div{flex:1;background:rgba(255,255,255,0.06);border:.5px solid var(--ln);border-radius:16px;padding:12px 4px 10px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.bar{height:6px;background:var(--c2);border-radius:9px;overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8e8e93,#fff);border-radius:9px;transition:width .8s var(--ease)}
.tag{font-size:max(11px,calc(10.5px*var(--fs)));font-weight:600;padding:2px 8px;border-radius:99px;background:var(--c3);color:var(--mu);margin-left:7px;vertical-align:2px;letter-spacing:.02em}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}.chip{background:var(--c2);color:var(--tx);border:.5px solid var(--ln);border-radius:99px;padding:8px 15px;font:500 max(11px,calc(14px*var(--fs))) var(--f);cursor:pointer;transition:all .25s var(--ease)}.chip:active{transform:scale(.94)}

.fab:active{transform:scale(.88) rotate(90deg)}

#toast.on{transform:translate(-50%,0) scale(1)}#toast>.i{width:26px;height:26px;padding:5px;border-radius:50%;background:#fff;color:#000;stroke-width:2.2}
#sh{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}

.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

@media(hover:hover){[data-tip]:hover::after{opacity:1;transform:none;transition-delay:.25s}.row:hover{background:rgba(255,255,255,0.035)}.btn:hover{filter:brightness(1.06);box-shadow:0 1px 0 rgba(255,255,255,0.6) inset,0 10px 28px rgba(255,255,255,0.16);transform:translateY(-1px)}.btn.g:hover{background:var(--c3);filter:none;box-shadow:inset 0 .5px 0 rgba(255,255,255,0.14),0 8px 20px rgba(0,0,0,0.4)}.ib:hover{background:var(--c3);color:#fff}.chip:hover{background:var(--c3);border-color:var(--ln2);transform:translateY(-1px)}nav a:hover:not(.on){color:#fff;background:rgba(255,255,255,0.07)}.fab:hover{transform:scale(1.08);box-shadow:0 14px 44px rgba(255,255,255,0.3),0 4px 16px rgba(0,0,0,0.7),inset 0 1px 0 #fff}.grp.lift{transition:transform .35s var(--ease),border-color .35s,box-shadow .35s}.grp.lift:hover{transform:translateY(-3px);border-color:var(--ln2);box-shadow:inset 0 .5px 0 rgba(255,255,255,0.1),0 16px 40px rgba(0,0,0,0.6)}.chk:hover{border-color:#fff;transform:scale(1.08)}input:hover,select:hover{border-color:var(--ln2)}}

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.035) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(80% 60% at 50% 40%,#000,transparent);mask-image:radial-gradient(80% 60% at 50% 40%,#000,transparent)}

.grp{background:rgba(18,18,20,0.58);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}

.grp{backdrop-filter:blur(12px) saturate(150%);-webkit-backdrop-filter:blur(12px) saturate(150%)}

.pvs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
